
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Hub Admin Login</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="login-container">

        <h1>Coding Hub</h1>
        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Admin Password"
                required
            >

            <p id="loginMessage"></p>

            <button type="submit">Login</button>

        </form>

    </div>

    <script src="js/admin.js"></script>

</body>
</html>
